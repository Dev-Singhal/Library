<!-- Self-hosted build: shows real favicons (via Google's favicon service). Data is saved in the browser's localStorage; AI categorisation is off, so categories come from URL keywords and can be changed on each card. -->
<style>
:root{--bg:#eef6f2;--glass:rgba(255,255,255,.6);--glass-b:rgba(255,255,255,.85);--text:#0f1a15;--muted:#55645d;--line:rgba(20,80,55,.14);--chip:rgba(255,255,255,.55);
--g1:#2fd08f;--g2:#14805a;--g3:#2563eb;--grad:linear-gradient(135deg,#34d399,#17936b);--accent-t:#fff;--shadow:0 10px 40px rgba(20,100,70,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d0c;--glass:rgba(255,255,255,.035);--glass-b:rgba(255,255,255,.08);--text:#eceeed;--muted:#8b928f;--line:rgba(255,255,255,.08);--chip:rgba(255,255,255,.04);--shadow:0 10px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d0c;--glass:rgba(255,255,255,.035);--glass-b:rgba(255,255,255,.08);--text:#eceeed;--muted:#8b928f;--line:rgba(255,255,255,.08);--chip:rgba(255,255,255,.04);--shadow:0 10px 40px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.aurora i:nth-child(1){width:560px;height:560px;background:var(--g1);bottom:-300px;left:50%;transform:translateX(-50%);opacity:.18}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:32px 20px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 32px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;letter-spacing:-.03em;background:linear-gradient(120deg,var(--text) 45%,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 14px rgba(47,208,143,.45))}
.sub{color:var(--muted);margin:4px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
button{font:inherit;cursor:pointer;color:inherit}
.btn-wrapper{position:relative;display:inline-block}
.btn{--border-radius:24px;--padding:4px;--transition:.4s;--button-color:#0d1110;--highlight-color-hue:155deg;user-select:none;display:flex;justify-content:center;padding:.55em 1.2em;align-items:center;font-size:1em;font-weight:400;color:#fff;background-color:var(--button-color);box-shadow:inset 0 1px 1px rgba(255,255,255,.2),inset 0 2px 2px rgba(255,255,255,.15),inset 0 4px 4px rgba(255,255,255,.1),inset 0 8px 8px rgba(255,255,255,.05),inset 0 16px 16px rgba(255,255,255,.05),0 -1px 1px rgba(0,0,0,.02),0 -2px 2px rgba(0,0,0,.03),0 -4px 4px rgba(0,0,0,.05),0 -8px 8px rgba(0,0,0,.06),0 -16px 16px rgba(0,0,0,.08);border:solid 1px #fff2;border-radius:var(--border-radius);cursor:pointer;transition:box-shadow var(--transition),border var(--transition),background-color var(--transition)}
.btn::before{content:"";position:absolute;top:calc(0px - var(--padding));left:calc(0px - var(--padding));width:calc(100% + var(--padding)*2);height:calc(100% + var(--padding)*2);border-radius:calc(var(--border-radius) + var(--padding));pointer-events:none;background-image:linear-gradient(0deg,#0004,#000a);z-index:-1;transition:box-shadow var(--transition),filter var(--transition);box-shadow:0 -8px 8px -6px #0000 inset,0 -16px 16px -8px #00000000 inset,1px 1px 1px #fff2,2px 2px 2px #fff1,-1px -1px 1px #0002,-2px -2px 2px #0001}
.btn::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;border-radius:inherit;pointer-events:none;background-image:linear-gradient(0deg,#fff,hsl(var(--highlight-color-hue),100%,70%),hsla(var(--highlight-color-hue),100%,70%,50%),8%,transparent);background-position:0 0;opacity:0;transition:opacity var(--transition),filter var(--transition)}
.btn-letter{position:relative;display:inline-block;color:#fff8;animation:letter-anim 2s ease-in-out infinite;transition:color var(--transition),text-shadow var(--transition),opacity var(--transition)}
@keyframes letter-anim{50%{text-shadow:0 0 3px #fff8;color:#fff}}
.btn-svg{flex-grow:0;flex-shrink:0;height:20px;margin-right:.35rem;fill:#e8e8e8;animation:flicker 2s linear infinite;animation-delay:.5s;filter:drop-shadow(0 0 2px #fff9);transition:fill var(--transition),filter var(--transition),opacity var(--transition)}
@keyframes flicker{50%{opacity:.3}}
.txt-wrapper{position:relative;display:flex;align-items:center;min-width:0}
.txt-1{animation:appear-anim 1s ease-in-out forwards;white-space:nowrap}
@keyframes appear-anim{0%{opacity:0}100%{opacity:1}}
.btn:focus .btn-letter{animation:focused-letter-anim 1s ease-in-out forwards,letter-anim 1.2s ease-in-out infinite;animation-delay:0s,1s}
@keyframes focused-letter-anim{0%,100%{filter:blur(0)}50%{transform:scale(2);filter:blur(10px) brightness(150%) drop-shadow(-36px 12px 12px hsl(var(--highlight-color-hue),100%,70%))}}
.btn:focus .btn-svg{animation-duration:1.2s;animation-delay:.2s}
.btn:focus::before{box-shadow:0 -8px 12px -6px #fff3 inset,0 -16px 16px -8px hsla(var(--highlight-color-hue),100%,70%,20%) inset,1px 1px 1px #fff3,2px 2px 2px #fff1,-1px -1px 1px #0002,-2px -2px 2px #0001}
.btn:focus::after{opacity:.6;mask-image:linear-gradient(0deg,#fff,transparent);filter:brightness(100%)}
.btn-letter:nth-child(1){animation-delay:0.00s}
.btn-letter:nth-child(2){animation-delay:0.08s}
.btn-letter:nth-child(3){animation-delay:0.16s}
.btn-letter:nth-child(4){animation-delay:0.24s}
.btn-letter:nth-child(5){animation-delay:0.32s}
.btn-letter:nth-child(6){animation-delay:0.40s}
.btn-letter:nth-child(7){animation-delay:0.48s}
.btn-letter:nth-child(8){animation-delay:0.56s}
.btn:focus .btn-letter:nth-child(n){animation-delay:0s,1s}
.btn:active{border:solid 1px hsla(var(--highlight-color-hue),100%,80%,70%);background-color:hsla(var(--highlight-color-hue),50%,20%,.5)}
.btn:active::before{box-shadow:0 -8px 12px -6px #fffa inset,0 -16px 16px -8px hsla(var(--highlight-color-hue),100%,70%,80%) inset,1px 1px 1px #fff4,2px 2px 2px #fff2,-1px -1px 1px #0002,-2px -2px 2px #0001}
.btn:active::after{opacity:1;mask-image:linear-gradient(0deg,#fff,transparent);filter:brightness(200%)}
.btn:active .btn-letter{text-shadow:0 0 1px hsla(var(--highlight-color-hue),100%,90%,90%);animation:none}
.btn:hover{border:solid 1px hsla(var(--highlight-color-hue),100%,80%,40%)}
.btn:hover::before{box-shadow:0 -8px 8px -6px #fffa inset,0 -16px 16px -8px hsla(var(--highlight-color-hue),100%,70%,30%) inset,1px 1px 1px #fff2,2px 2px 2px #fff1,-1px -1px 1px #0002,-2px -2px 2px #0001}
.btn:hover::after{opacity:1;mask-image:linear-gradient(0deg,#fff,transparent)}
.btn:hover .btn-svg{fill:#fff;filter:drop-shadow(0 0 3px hsl(var(--highlight-color-hue),100%,70%)) drop-shadow(0 -4px 6px #0009);animation:none}
@media (prefers-reduced-motion:reduce){.btn-letter,.btn-svg,.txt-1{animation:none}.btn-letter{color:#fff}}
.tabs{--hue:155deg;position:relative;display:inline-flex;gap:4px;margin:0;padding:5px;border-radius:28px;background:#0d1110;border:solid 1px #fff2;box-shadow:inset 0 1px 1px rgba(255,255,255,.2),inset 0 2px 2px rgba(255,255,255,.12),inset 0 4px 4px rgba(255,255,255,.08),inset 0 8px 8px rgba(255,255,255,.04),0 -2px 2px rgba(0,0,0,.03),0 -4px 4px rgba(0,0,0,.05),0 -8px 8px rgba(0,0,0,.06)}
.tabs::before{content:"";position:absolute;inset:-4px;border-radius:32px;pointer-events:none;z-index:-1;background-image:linear-gradient(0deg,#0004,#000a);box-shadow:1px 1px 1px #fff2,2px 2px 2px #fff1,-1px -1px 1px #0002,-2px -2px 2px #0001}
.tab{position:relative;background:#0d1110;border:solid 1px transparent;padding:9px 20px;border-radius:22px;color:#fff8;font-weight:500;transition:color .4s,border .4s,box-shadow .4s,background-color .4s}
.tab::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:linear-gradient(0deg,#fff,hsl(var(--hue),100%,70%),hsla(var(--hue),100%,70%,50%),8%,transparent);opacity:0;mask-image:linear-gradient(0deg,#fff,transparent);-webkit-mask-image:linear-gradient(0deg,#fff,transparent);transition:opacity .4s}
.tab:hover{color:#fff;border-color:hsla(var(--hue),100%,80%,30%)}
.tab[aria-selected="true"]{color:#fff;text-shadow:0 0 3px #fff8;border-color:hsla(var(--hue),100%,80%,40%);box-shadow:0 -8px 8px -6px #fffa inset,0 -16px 16px -8px hsla(var(--hue),100%,70%,30%) inset,1px 1px 1px #fff2}
.tab[aria-selected="true"]::after{opacity:.55}
.tab:active{background-color:hsla(var(--hue),50%,20%,.5)}
.count{font-weight:500;margin-left:6px;font-size:12px;opacity:.8}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .15s}
.chip:hover{border-color:var(--g1);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{--text:#eceeed;--muted:#8b928f;position:relative;overflow:hidden;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;background:#16251c;filter:drop-shadow(0 20px 13px rgba(0,0,0,.18)) drop-shadow(0 8px 5px rgba(0,0,0,.15));color:var(--text);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card::before{content:"";position:absolute;inset:2px;border-radius:12px;background:#0b0b0b;opacity:.9;z-index:1;pointer-events:none}
.card::after{content:"";position:absolute;width:224px;height:192px;left:-50%;top:-50%;background:#fff;filter:blur(50px);z-index:0;pointer-events:none;transition:opacity .3s}
.card>*{position:relative;z-index:2}
.card>.del{position:absolute}
.card .cat{appearance:none;-webkit-appearance:none;width:auto;max-width:100%;margin:4px 0 0;padding:7px 32px 7px 14px;font-size:12px;line-height:1.2;border-radius:999px;align-self:flex-start;border:1px solid rgba(255,255,255,.14);color:#eceeed;cursor:pointer;background:rgba(255,255,255,.06) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23a6b0aa' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 13px center/10px 6px;transition:border-color .2s,background-color .2s}
.card .cat:hover{border-color:rgba(255,255,255,.3);background-color:rgba(255,255,255,.1)}
.card .cat:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(47,208,143,.2)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:28px 0 16px}
.search{display:block;flex:1 1 200px;width:auto;max-width:380px;margin:0 0 0 auto;padding:11px 18px;border-radius:999px}
.card .co{width:100%;margin:0;padding:8px 12px;font-size:12.5px;border-radius:10px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.16);color:#eceeed}
.card .co:not(:placeholder-shown){border-style:solid;border-color:rgba(255,255,255,.12)}
.card .co::placeholder{color:#8b928f}
.card a.t{color:var(--text);text-decoration:none;font-weight:600;display:flex;gap:12px;align-items:center;padding-right:24px}
.av img{width:24px;height:24px;border-radius:6px;display:block}
.av{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.host{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.desc{color:var(--muted);font-size:13.5px;margin:0}
.del{position:absolute;top:12px;right:12px;z-index:2;background:none;border:0;color:var(--muted);font-size:18px;line-height:1;opacity:.5}
.del:hover{opacity:1;color:#ff5c7a}
.empty{color:var(--muted);text-align:center;padding:64px 20px;border:1px dashed var(--line);border-radius:20px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
dialog{border:1px solid var(--glass-b);border-radius:24px;background:var(--glass);background-color:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--text);width:min(440px,92vw);padding:24px;backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(4,8,6,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog h2{margin:0 0 14px;font:700 21px system-ui,sans-serif;letter-spacing:-.02em}
input,select{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--chip);color:var(--text);margin-bottom:10px;outline:none}
input:focus,select:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(47,208,143,.25)}
select option{color:#111;background:#fff}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--chip)}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.row button{padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--chip)}
.row .go{background:var(--grad);color:#fff;border:0;font-weight:600;box-shadow:0 6px 20px rgba(47,208,143,.4)}
.hint{font-size:12.5px;color:var(--muted);margin:-2px 0 10px}
</style>
</head>
<body>
<div class="aurora"><i></i></div>
<div class="wrap">
  <header>
    <div class="brand"><svg class="logo" aria-hidden="true" viewBox="0 0 256 256" fill="none"><defs><linearGradient id="lg" x1="0" y1="256" x2="256" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#17936b"/><stop offset="1" stop-color="#5eead4"/></linearGradient></defs><path d="M 64 192 L 256 192 L 256 256 L 0 256 L 0 0 L 64 0 Z M 256 160 L 96 160 L 96 0 L 256 0 Z M 176 48 C 158.327 48 144 62.327 144 80 C 144 97.673 158.327 112 176 112 C 193.673 112 208 97.673 208 80 C 208 62.327 193.673 48 176 48 Z" fill="url(#lg)"/></svg><div><h1>My Library</h1><p class="sub">Resources and portfolios worth keeping</p></div></div>
    <div class="btn-wrapper"><button class="btn" id="addBtn" type="button"><svg class="btn-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg><span class="txt-wrapper"><span class="txt-1"><span class="btn-letter">A</span><span class="btn-letter">d</span><span class="btn-letter">d</span><span class="btn-letter"> </span><span class="btn-letter">l</span><span class="btn-letter">i</span><span class="btn-letter">n</span><span class="btn-letter">k</span></span></span></button></div>
  </header>
  <div class="bar"><div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="resources" aria-selected="true">Resources<span class="count" id="c-resources"></span></button>
    <button class="tab" role="tab" data-tab="portfolios" aria-selected="false">Portfolios<span class="count" id="c-portfolios"></span></button>
  </div>
    <input class="search" id="q" type="search" placeholder="Search by name, company or category…" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</div>

<dialog id="dlg">
  <h2>Add a link</h2>
  <div class="seg" id="seg">
    <button type="button" data-t="resources" aria-pressed="true">Resource</button>
    <button type="button" data-t="portfolios" aria-pressed="false">Portfolio</button>
  </div>
  <input id="url" type="url" placeholder="Paste a link…" autocomplete="off">
  <p class="hint" id="hint">The category is detected automatically. You can change it afterwards.</p>
  <div class="row"><button type="button" id="cancel">Cancel</button><button type="button" class="go" id="save">Add</button></div>
</dialog>

<script>
const CATS={
  resources:["Components","Prompts","Code","Motion","Inspiration","Icons & Fonts","Colors","Tools","Other"],
  portfolios:["Product Design","Motion Design","Brand & Graphic","3D","Creative Dev","Other"]
};
const KW={
  resources:[
    ["Components",/(component|ui-kit|uikit|shadcn|radix|untitledui|ui\.|tailwindui|figma\.com\/community|mantine|chakra|aceternity|magicui|21st\.dev)/],
    ["Prompts",/(prompt|promptbase|flowgpt|chatgpt|midjourney|prompthero)/],
    ["Code",/(github\.com|gitlab|codepen|codesandbox|stackblitz|npmjs|stackoverflow|docs\.|dev\.to|replit|jsfiddle)/],
    ["Motion",/(lottie|rive\.app|framer\.com\/motion|motion\.dev|gsap|easing|animat|spline|cubic-bezier|lottiefiles)/],
    ["Inspiration",/(dribbble|behance|awwwards|mobbin|pinterest|land-book|godly|savee|siteinspire|refero|page\.flows|lapa)/],
    ["Icons & Fonts",/(icon|fonts|typeface|fontshare|phosphor|lucide|heroicons|noun|flaticon|fontsource)/],
    ["Colors",/(color|colour|coolors|palette|adobe\.com\/color|realtimecolors)/],
    ["Tools",/(figma\.com|notion|canva|vercel|linear|framer\.com|tool|app\.)/]
  ],
  portfolios:[
    ["Motion Design",/(motion|animat|vimeo|lottie|rive|aftereffects|3danim)/],
    ["3D",/(3d|blender|spline|cinema4d|c4d|sketchfab)/],
    ["Brand & Graphic",/(brand|logo|graphic|identity|typograph|illustrat)/],
    ["Creative Dev",/(github|codepen|webgl|three|creative-?dev|\.dev)/],
    ["Product Design",/(product|ux|ui|figma|framer|webflow|case-?stud)/]
  ]
};
const COLORS=["linear-gradient(135deg,#ff7a45,#ff3d77)","linear-gradient(135deg,#6a5cff,#22d3ee)","linear-gradient(135deg,#14b8a6,#84cc16)","linear-gradient(135deg,#a855f7,#ec4899)","linear-gradient(135deg,#f59e0b,#ef4444)","linear-gradient(135deg,#3b82f6,#8b5cf6)"];
let state={items:[],tab:"resources",cat:"All",q:""},store=null,addType="resources";
const $=s=>document.querySelector(s);

function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch{return u}}
function norm(u){u=u.trim();return /^https?:\/\//i.test(u)?u:"https://"+u}
function guess(type,url){
  const s=url.toLowerCase();
  for(const [c,re] of KW[type]) if(re.test(s)) return c;
  return "Other";
}
function cleanTitle(u){
  try{const x=new URL(u);const p=x.pathname.split("/").filter(Boolean).pop();
    return p?decodeURIComponent(p).replace(/[-_]+/g," ").replace(/\.\w+$/,""):x.hostname.replace(/^www\./,"")}catch{return u}
}

async function loadStore(){
  try{
    const db=await claude.use("db");
    if(db){store={kind:"db",ref:db.doc("library/main")};
      const s=await store.ref.get();return s.exists?(s.data().items||[]):[];}
  }catch(e){}
  try{return JSON.parse(localStorage.getItem("lib")||"[]")}catch{return []}
}
async function persist(){
  try{
    if(store&&store.kind==="db"){await store.ref.set({items:state.items});return}
  }catch(e){}
  try{localStorage.setItem("lib",JSON.stringify(state.items))}catch(e){}
}

function render(){
  for(const t of ["resources","portfolios"])$("#c-"+t).textContent=state.items.filter(i=>i.type===t).length;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===state.tab));
  const list=state.items.filter(i=>i.type===state.tab);
  const cats=["All",...CATS[state.tab]].filter(c=>c==="All"||list.some(i=>i.category===c)||state.cat===c);
  $("#chips").replaceChildren(...cats.map(c=>{
    const b=document.createElement("button");b.className="chip";b.textContent=c;
    b.setAttribute("aria-pressed",state.cat===c);b.onclick=()=>{state.cat=c;render()};return b}));
  const q=state.q.trim().toLowerCase();
  const shown=list.filter(i=>(state.cat==="All"||i.category===state.cat)&&(!q||[i.title,i.company,i.category,i.desc,host(i.url)].some(v=>(v||"").toLowerCase().includes(q)))).sort((a,b)=>b.added-a.added);
  const g=$("#grid");g.replaceChildren();
  if(!shown.length){const d=document.createElement("div");d.className="empty";d.style.gridColumn="1/-1";
    d.textContent=q?"No matches for “"+state.q.trim()+"”.":"Nothing here yet. Tap “Add link” and paste something you like.";g.append(d);return}
  for(const i of shown){
    const c=document.createElement("div");c.className="card";
    const a=document.createElement("a");a.className="t";a.href=i.url;a.target="_blank";a.rel="noopener noreferrer";
    const av=document.createElement("span");av.className="av";
    av.style.background=COLORS[[...host(i.url)].reduce((n,ch)=>n+ch.charCodeAt(0),0)%COLORS.length];
    av.textContent=(host(i.url)[0]||"?").toUpperCase();
    const im=new Image();im.alt="";im.referrerPolicy="no-referrer";
    const srcs=["https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE&size=64&nfrp=2&url="+encodeURIComponent(i.url),
      "https://icons.duckduckgo.com/ip3/"+encodeURIComponent(host(i.url))+".ico"];
    let k=0;const next=()=>{if(k<srcs.length)im.src=srcs[k++]};
    im.onerror=next;
    im.onload=()=>{if(im.naturalWidth<=1){next();return}av.textContent="";av.style.background="rgba(255,255,255,.08)";av.append(im)};
    next();
    const w=document.createElement("span");w.style.minWidth="0";
    const t=document.createElement("div");t.textContent=i.title;
    const h=document.createElement("div");h.className="host";h.textContent=host(i.url);
    w.append(t,h);a.append(av,w);
    const del=document.createElement("button");del.className="del";del.title="Remove";del.textContent="×";
    del.onclick=async()=>{state.items=state.items.filter(x=>x.id!==i.id);render();persist()};
    c.append(a,del);
    if(i.desc){const p=document.createElement("p");p.className="desc";p.textContent=i.desc;c.append(p)}
    const co=document.createElement("input");co.className="co";co.placeholder="Add company";co.maxLength=60;co.value=i.company||"";co.setAttribute("aria-label","Company");
    co.onchange=()=>{i.company=co.value.trim();persist();render()};
    co.onkeydown=e=>{if(e.key==="Enter")co.blur()};
    const sel=document.createElement("select");
    sel.className="cat";
    sel.title="Change category";
    CATS[i.type].forEach(o=>{const op=document.createElement("option");op.textContent=o;op.selected=o===i.category;sel.append(op)});
    sel.onchange=()=>{i.category=sel.value;render();persist()};
    if(i.type==="portfolios")c.append(co);c.append(sel);g.append(c);
  }
}

async function classify(item){
  try{
    const sample=await claude.use("sample");if(!sample)return;
    const r=await sample.json(
      `Classify this link saved to a designer's personal library. Type: ${item.type==="resources"?"resource":"portfolio"}.\nURL: ${item.url}\n`+
      `Allowed categories: ${JSON.stringify(CATS[item.type])}.\n`+
      `Resources: Components=UI kits/libraries, Prompts=AI prompt collections, Code=repos/snippets/docs, Motion=animation tools/libraries, Inspiration=galleries, Icons & Fonts, Colors, Tools=apps/utilities. Portfolios: pick the person's main discipline from the URL if possible.\n`+
      `Reply with ONLY JSON: {"title":"short readable name (max 6 words)","category":"one allowed category","desc":"one sentence, max 14 words, or empty if unknown"}. Do not invent details you cannot infer.`);
    if(r&&CATS[item.type].includes(r.category)){item.category=r.category}
    if(r&&r.title)item.title=String(r.title).slice(0,80);
    if(r&&r.desc)item.desc=String(r.desc).slice(0,140);
    render();persist();
  }catch(e){}
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.cat="All";render()});
$("#addBtn").onclick=()=>{addType=state.tab;syncSeg();$("#url").value="";$("#dlg").showModal();$("#url").focus()};
$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
$("#cancel").onclick=()=>$("#dlg").close();
function syncSeg(){document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===addType))}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{addType=b.dataset.t;syncSeg()});
async function add(){
  const raw=$("#url").value.trim();if(!raw)return;
  const url=norm(raw);try{new URL(url)}catch{$("#hint").textContent="That doesn’t look like a valid link.";return}
  if(state.items.some(i=>i.url===url&&i.type===addType)){$("#hint").textContent="Already saved.";return}
  const item={id:Date.now().toString(36),type:addType,url,title:cleanTitle(url),category:guess(addType,url),desc:"",added:Date.now()};
  state.items.push(item);state.tab=addType;state.cat="All";
  $("#dlg").close();render();persist();classify(item);
}
$("#save").onclick=add;
$("#url").addEventListener("keydown",e=>{if(e.key==="Enter")add()});

render();
loadStore().then(items=>{if(items.length){const ids=new Set(state.items.map(i=>i.id));state.items=[...items,...state.items.filter(i=>!items.some(x=>x.id===i.id))];render()}});
</script>
</body>
